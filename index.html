<title>ครัว–ซักล้าง 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{--bg:#dfe7ec;--panel:rgba(255,255,255,.92);--ink:#22282d;--ink2:#5d666d;--rule:#d3d8dc;--on:#3c4248;--onink:#fff;--acc:#9b6a3c;
  --f:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1b2125;--panel:rgba(30,35,39,.92);--ink:#e7eae8;--ink2:#a3abb0;--rule:#3a4248;--on:#d7dcdf;--onink:#1b2125;--acc:#d19a62;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.grp{pointer-events:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;backdrop-filter:blur(6px)}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-weight:600}
.title small{font-weight:400;color:var(--ink2);margin-left:6px}
button{font:inherit;font-size:13px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:5px;padding:5px 10px;cursor:pointer}
button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#layers[hidden]{display:none}
.hint{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:var(--ink2);background:var(--panel);padding:3px 8px;border-radius:5px;pointer-events:none}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink2)}
[hidden]{display:none!important}
</style>
</head>
